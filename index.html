<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCSE Listening Portal & Revision Notes</title>
    <style>
        :root { --primary: #10b981; --bg: #111827; --text: #f3f4f6; }
        body, html { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        .portal-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; box-sizing: border-box; }
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 10px; }
        .sub { color: #9ca3af; margin-bottom: 40px; }
        .module-card { background: #1f2937; padding: 30px; border-radius: 12px; border: 1px solid #374151; max-width: 400px; width: 100%; cursor: pointer; transition: transform 0.2s; margin-top: 20px;}
        .module-card:hover { transform: scale(1.02); border-color: var(--primary); }
        .module-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 8px; }
        .module-desc { font-size: 0.875rem; color: #9ca3af; }
        #gameContainer { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9999; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="portal-view" id="portalView">
        <h1>GCSE Listening Portal & Revision Notes</h1>
        <p class="sub">Select an assignment module below to view course materials.</p>
        
        <div class="module-card" onclick="launchGame()">
            <div class="module-title">Module 1.1 - Oral Practice</div>
            <div class="module-desc">Strategic Optimization & Fast Reaction Time Simulation</div>
        </div>
    </div>

    <div id="gameContainer">
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <script>
    function launchGame() {
        const container = document.getElementById("gameContainer");
        const frame = document.getElementById("gameFrame");
        
        // Fixed path using raw spaces instead of broken %20 codes
        frame.src = "retro bowl college main/retrobowl/index.html";
        container.style.display = "block";
    }

    // PANIC KEY: Press Escape to instantly close the game and show the portal
    window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const container = document.getElementById("gameContainer");
            const frame = document.getElementById("gameFrame");
            container.style.display = "none";
            frame.src = ""; 
        }
    });
</script>
</body>
</html>
